# H2 experiment: "Multimodal (text + image) embeddings beat single-modality."
#
# The H2 grid compares three modalities on the same graph and GNN backbone:
#
#   text_only   — best text encoder from H3 (no images).
#   image_only  — precomputed 4096-dim Caffe image features (McAuley/UCSD).
#   text+image  — fusion of best text encoder + image features using
#                 three fusion strategies (concat / weighted / gated).
#
# Each (modality × fusion) combination gets its own hyperparameter search
# (FAIR) and seed sweep (STATISTICALLY SOUND).
#
# Image features
# --------------
# The McAuley/UCSD distribution at
# https://cseweb.ucsd.edu/~jmcauley/datasets/amazon/links.html publishes
# 4096-dim Caffe reference visual features alongside the metadata.  We use
# those directly — no image downloads, no on-the-fly vision encoder.  The
# binary format is documented in ``src/data/image_features.py``.
#
# Place the files in ``data/raw/image_features_<Category>.b`` (same folder
# as the metadata JSONL files).
#
# Missing-image confounder analysis
# ----------------------------------
# Some products in the metadata files have no entry in the image-features
# file (e.g. deleted listings).  Those nodes receive zero image vectors.
# The H2 runner flags a ">5 pp gap" warning when test accuracy on nodes
# WITH available features is more than 5 percentage points higher than on
# nodes WITHOUT, indicating that the model may be exploiting the missing-
# data pattern rather than image content.
#
# Design rules (from supervisor):
#   - Each combo gets its own hyperparameter search (FAIR).
#   - H1 best-GNN and H3 best-text-encoder hyperparams used as warm-starts.
#   - Fixed seeds, deterministic splits shared with H1 (same split_seed).
#   - >= 5 seeds; report mean ± std + 95% CI.
#   - Every run logs a JSON file to results/.

# --------------------------------------------------------------------------
# Dataset  (identical to H1/H3 so splits are reused)
# --------------------------------------------------------------------------
dataset:
  root: data
  categories:
    # - Electronics
    # - Books
    # - Movies_and_TV
    # - CDs_and_Vinyl
    # - Clothing_Shoes_and_Jewelry
    # - Home_and_Kitchen
    # - Kindle_Store
    # - Sports_and_Outdoors
    # - Cell_Phones_and_Accessories
    # - Health_and_Personal_Care
    # - Toys_and_Games
    # - Video_Games
    # - Tools_and_Home_Improvement
    # - Beauty
    # - Apps_for_Android
    # - Office_Products
    # - Pet_Supplies
    # - Automotive
    # - Grocery_and_Gourmet_Food
    # - Patio,_Lawn_and_Garden
    - Musical_Instruments
    # - Baby
    # - Digital_Music
    # - Amazon_Instant_Video
  split_ratios: [0.6, 0.2, 0.2]
  split_seed: 0
  label_level: 1

# --------------------------------------------------------------------------
# Prior-experiment result paths (used for warm-starts)
# --------------------------------------------------------------------------
h1_results_path: results/h1_results.json
h3_results_path: results/h3_results.json

# Fallbacks when result files don't exist (e.g., --mock smoke tests).
fallback_gnn: GCN
fallback_hparams:
  lr: 0.01
  weight_decay: 0.0001
  hidden_channels: 128
  dropout: 0.3

# Name of the text encoder to use when H3 results are unavailable.
# Must match one of the ``name`` values in the ``text_encoders`` list below.
fallback_text_encoder: tfidf

# --------------------------------------------------------------------------
# Image-feature settings
#
# The runner expects one binary file per dataset category, at
# ``<dataset.root>/raw/image_features_<Category>.b``.  These are the
# 4096-dim Caffe features from
# https://cseweb.ucsd.edu/~jmcauley/datasets/amazon/links.html.
#
# The format and loader live in src/data/image_features.py.
# --------------------------------------------------------------------------
image_features:
  feature_dim: 4096   # informational; loader uses the constant in image_features.py
  source: mcauley-caffe

# --------------------------------------------------------------------------
# Text encoders
#
# All encoders from H3 are listed here so the runner can look up their
# constructor configs by name.  The runner selects the best one from H3
# results (or falls back to ``fallback_text_encoder``) and uses it for
# both text_only and text+image modalities.
# --------------------------------------------------------------------------
text_encoders:

  - name: tfidf
    type: TFIDF
    max_features: 10000
    min_df: 2

  - name: bow
    type: BagOfWords
    max_features: 10000
    min_df: 2

  - name: sbert
    type: SentenceBERT
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 64
    normalize_embeddings: true

  - name: clip-text
    type: CLIPText
    model_name: openai/clip-vit-base-patch32
    batch_size: 64
    normalize_embeddings: true

  - name: qwen3-0.6B
    type: Qwen3
    model_size: "0.6B"
    batch_size: 16
    pooling: last_token
    normalize_embeddings: true

# --------------------------------------------------------------------------
# Fusion strategies
#
# Applied only for ``text+image`` modality.  Each strategy is paired with
# the (text_encoder × precomputed_image_features) combination.
# --------------------------------------------------------------------------
fusion_strategies: [concat, weighted, gated]

# --------------------------------------------------------------------------
# Modalities to evaluate
#
# text_only   — 1 run (text encoder selected from H3).
# image_only  — 1 run (single precomputed feature set).
# text+image  — 1 run per fusion strategy = 3 runs.
# --------------------------------------------------------------------------
modalities: [text_only, image_only, text+image]

# --------------------------------------------------------------------------
# GNN hyperparameter search space
# --------------------------------------------------------------------------
gnn_search_space:
  lr:              [0.005, 0.01, 0.05]
  weight_decay:    [0.0, 0.0001, 0.001]
  hidden_channels: [64, 128, 256]
  dropout:         [0.0, 0.3, 0.5]

# --------------------------------------------------------------------------
# Training settings
# --------------------------------------------------------------------------
training:
  num_layers:       2
  num_heads:        2           # GAT only
  max_epochs:       200
  patience:         20
  warmup_epochs:    10
  min_lr:           0.0001
  n_hparam_trials:  20          # random HP trials per (combo) pair
  n_seed_runs:      5           # seed-sweep repetitions
  base_seed:        0

# --------------------------------------------------------------------------
# Output paths
# --------------------------------------------------------------------------
results:
  dir:            results
  output_file:    results/h2_results.json
  embeddings_dir: data/embeddings
